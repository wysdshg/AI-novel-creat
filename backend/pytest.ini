[pytest]
# Phase 0.1 单测骨架。只收离线单测（tests/unit）——
# e2e 需要后端已启动，手动跑：python tests/e2e/test_full_chain.py
testpaths = tests/unit
pythonpath = .
addopts = -q
# ⚠️ 关掉 tmp_path 保留：pytest 默认会保留最近几次的临时目录（pytest-of-*/garbage-*）
# 并在下次运行时自动清理旧的 —— 在 WorkBuddy 沙箱里这个"删除"会被安全钩子拦下
# （报 "Command rejected: bulk delete request"），导致整个测试会话跑不起来。
# 我们只需要临时库存在期间可用，跑完即可弃，无保留需求。
tmp_path_retention_policy = none
